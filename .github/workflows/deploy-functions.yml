name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Edge Functions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        continue-on-error: true
        run: |
          supabase functions deploy email-intake       --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy invoice-processor  --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy send-approval      --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy process-approval   --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-csv       --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy reminder-scheduler --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy sync-approvers     --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy admin-actions      --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy list-mail-folders  --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy diagnose-graph     --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy poll-mailbox       --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set Edge Function secrets
        run: |
          supabase secrets set \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
            FINANCE_MAILBOX="${{ secrets.FINANCE_MAILBOX }}" \
            FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            REMINDER_DAYS="${{ secrets.REMINDER_DAYS }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Disable JWT verification for user-facing functions
        run: |
          # These functions handle auth internally or are called server-to-server
          # and must not be blocked by the platform gateway verify_jwt check
          for fn in invoice-processor send-approval process-approval generate-csv admin-actions sync-approvers reminder-scheduler; do
            curl -X PATCH \
              "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/functions/$fn" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"verify_jwt":false}' || echo "Warning: Could not set verify_jwt=false for $fn"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
