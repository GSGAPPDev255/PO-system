name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Edge Functions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        continue-on-error: true
        run: |
          # Don't let one failing function abort the rest — deploy each
          # independently and report per-function success/failure at the end.
          set +e
          FAILED=""
          REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          for fn in \
            email-intake invoice-processor send-approval process-approval \
            generate-csv reminder-scheduler sync-approvers admin-actions \
            list-mail-folders diagnose-graph poll-mailbox; do
            echo "::group::Deploy $fn"
            if supabase functions deploy "$fn" --project-ref "$REF"; then
              echo "✓ $fn deployed"
            else
              echo "::warning::Failed to deploy $fn"
              FAILED="$FAILED $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::warning::The following functions failed to deploy:$FAILED"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set Edge Function secrets
        run: |
          # NOTE: AZURE_CLIENT_SECRET is intentionally NOT synced here.
          # It is managed directly in the Supabase dashboard (Edge Function
          # secrets) so a deploy can never silently overwrite a freshly-rotated
          # Azure client secret with a stale GitHub copy. Rotate it in Supabase.
          supabase secrets set \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            FINANCE_MAILBOX="${{ secrets.FINANCE_MAILBOX }}" \
            FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
            REMINDER_DAYS="${{ secrets.REMINDER_DAYS }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Disable JWT verification for user-facing functions
        run: |
          # These functions handle auth internally or are called server-to-server
          # and must not be blocked by the platform gateway verify_jwt check.
          # email-intake is triggered by the pg_cron scheduler (no user JWT), so
          # it must stay verify_jwt=false too.
          for fn in email-intake invoice-processor send-approval process-approval generate-csv admin-actions sync-approvers reminder-scheduler; do
            curl -X PATCH \
              "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/functions/$fn" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"verify_jwt":false}' || echo "Warning: Could not set verify_jwt=false for $fn"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
